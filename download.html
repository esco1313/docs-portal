<!DOCTYPE html>
<html>
<body>
<script>
fetch('DocsignV2.html')
  .then(r => r.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'DocsignV2.html';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
